<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Seu crachá · Dia Um · MS CREATIVE KEYS</title>
<meta name="description" content="Você está no Dia Um. Pegue o crachá do que você pôs pra rodar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Inter+Tight:ital,wght@0,300..700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0A0C10; --bg-2:#12141A; --surface:#1A1D26;
    --head-muted:#8f8a7e; --heading:#ECE5D7; --text:#C2BAAB;
    --text-muted:rgba(194,186,171,.42); --accent:#A89D80;
    --hl:#B4C636; --hl-2:#6A7820; --border:rgba(255,255,255,.06);
    --grid:rgba(255,255,255,.025); --grid-size:54px; --radius:4px;
    --font-display:'Fraunces',Georgia,serif;
    --font-body:'Inter Tight',-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono','Courier New',monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;
    background:linear-gradient(145deg,var(--bg-1) 0%,var(--bg-2) 100%) fixed;
    color:var(--text);font-family:var(--font-body);
    display:flex;flex-direction:column;align-items:center;
    padding:2.5rem 1.2rem 4rem;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(var(--grid) 1px,transparent 1px),
      linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:var(--grid-size) var(--grid-size);
  }
  .wrap{position:relative;z-index:1;width:100%;max-width:560px;text-align:center}
  .wordmark{
    font-family:var(--font-mono);font-weight:500;font-size:.8rem;
    letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
    margin-bottom:1.6rem;
  }
  .lede{
    font-family:var(--font-mono);font-size:.72rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--hl);margin:0 0 1.8rem;
  }

  /* crachá */
  .badge-shell{
    margin:0 auto;width:100%;max-width:440px;
    border:1px solid var(--border);border-radius:8px;overflow:hidden;
    box-shadow:0 30px 80px -30px rgba(0,0,0,.7);
  }
  svg.badge{display:block;width:100%;height:auto}

  /* controles */
  .controls{margin:2.2rem auto 0;max-width:440px}
  label{
    display:block;font-family:var(--font-mono);font-size:.7rem;
    letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted);
    margin:0 0 .55rem;
  }
  input[type=text]{
    width:100%;padding:.85em 1em;border-radius:var(--radius);
    background:var(--surface);border:1px solid var(--border);
    color:var(--heading);font-family:var(--font-display);font-size:1.1rem;
    text-align:center;letter-spacing:.01em;
  }
  input[type=text]:focus{outline:none;border-color:var(--hl)}
  .btn{
    display:inline-block;margin-top:1.3rem;cursor:pointer;
    font-family:var(--font-body);font-weight:600;font-size:1.02rem;line-height:1;
    color:var(--bg-1);background:linear-gradient(135deg,#B4C636,#8aa028);
    padding:.95em 1.7em;border-radius:var(--radius);border:1px solid var(--hl);
    transition:.15s;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .hint{
    font-family:var(--font-mono);font-size:.74rem;letter-spacing:.04em;
    color:var(--text-muted);margin-top:1rem;line-height:1.6;
  }
  .footer{
    position:relative;z-index:1;margin-top:3rem;
    font-family:var(--font-mono);font-size:.72rem;letter-spacing:.04em;
    color:var(--text-muted);
  }
  .footer strong{color:var(--accent);font-weight:500}
</style>
</head>
<body>
  <div class="wrap">
    <div class="wordmark">MS&nbsp;CREATIVE&nbsp;KEYS</div>
    <p class="lede">o Pulso · 3/3 · está vivo</p>

    <div class="badge-shell">
      <!-- crachá: 440 x 560 -->
      <svg class="badge" id="badge" viewBox="0 0 440 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Crachá Dia Um">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0A0C10"/>
            <stop offset="1" stop-color="#12141A"/>
          </linearGradient>
          <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#B4C636"/>
            <stop offset="0.45" stop-color="#6A7820"/>
            <stop offset="1" stop-color="#6A7820" stop-opacity="0"/>
          </linearGradient>
          <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
            <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
          </pattern>
        </defs>

        <rect width="440" height="560" fill="url(#bg)"/>
        <rect width="440" height="560" fill="url(#grid)"/>
        <rect x="0.5" y="0.5" width="439" height="559" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

        <!-- wordmark -->
        <text x="40" y="58" font-family="'IBM Plex Mono',monospace" font-size="12" letter-spacing="3.4" fill="#A89D80">MS CREATIVE KEYS</text>

        <!-- título -->
        <text x="40" y="150" font-family="Fraunces,serif" font-weight="600" font-size="74" fill="#8f8a7e">DIA</text>
        <text x="40" y="232" font-family="Fraunces,serif" font-weight="600" font-size="74" fill="#8f8a7e" font-style="italic"><tspan fill="#B4C636">UM</tspan></text>
        <rect x="42" y="258" width="150" height="2" fill="url(#rule)"/>

        <!-- subtítulo -->
        <text x="42" y="296" font-family="'Inter Tight',sans-serif" font-size="15" fill="#C2BAAB">Sua v1 está no ar.</text>

        <!-- nome -->
        <text x="40" y="370" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2.6" fill="rgba(194,186,171,.42)">DIA UM DE</text>
        <text id="svgName" x="40" y="408" font-family="Fraunces,serif" font-weight="600" font-size="30" fill="#ECE5D7">Seu nome</text>

        <!-- pulso 3/3 -->
        <text x="40" y="438" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="2.6" fill="rgba(194,186,171,.42)">O PULSO</text>
        <circle cx="48" cy="464" r="9" fill="#B4C636"/>
        <circle cx="82" cy="464" r="9" fill="#B4C636"/>
        <circle cx="116" cy="464" r="9" fill="#B4C636"/>
        <text x="148" y="469" font-family="'IBM Plex Mono',monospace" font-size="15" letter-spacing="1" fill="#B4C636">3/3</text>

        <!-- as 4 peças no ar — ícones de arquivo (Opção B) -->
        <svg x="81" y="488" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4C636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
        <svg x="169" y="488" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4C636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
        <svg x="257" y="488" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4C636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <svg x="345" y="488" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B4C636" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        <text x="90" y="524" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1" fill="#C2BAAB">voz</text>
        <text x="178" y="524" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1" fill="#C2BAAB">skill</text>
        <text x="266" y="524" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1" fill="#C2BAAB">repo</text>
        <text x="354" y="524" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="1" fill="#C2BAAB">rotina</text>

        <!-- rodapé -->
        <text x="40" y="546" font-family="'IBM Plex Mono',monospace" font-size="10.5" letter-spacing="1.4" fill="rgba(194,186,171,.42)">Você está no Dia Um.</text>
      </svg>
    </div>

    <div class="controls">
      <label for="name">Seu nome no crachá</label>
      <input type="text" id="name" placeholder="Escreva seu nome" autocomplete="name" maxlength="28">
      <br>
      <button class="btn" id="download" type="button">Baixe seu crachá</button>
      <p class="hint">Põe seu nome, baixe o PNG, e posta no feed com teu 3/3.</p>
    </div>
  </div>

  <div class="footer">— Marcel Serrano · MS CREATIVE KEYS · <strong>Dia Um</strong></div>

<script>
  const input = document.getElementById('name');
  const svgName = document.getElementById('svgName');
  input.addEventListener('input', () => {
    const v = input.value.trim();
    svgName.textContent = v || 'Seu nome';
  });

  document.getElementById('download').addEventListener('click', () => {
    const svg = document.getElementById('badge');
    const scale = 3; // ~1320x1680, bom pra feed/print
    const xml = new XMLSerializer().serializeToString(svg);
    const svg64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = 440 * scale; c.height = 560 * scale;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const a = document.createElement('a');
      const slug = (input.value.trim() || 'dia-um').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      a.download = 'cracha-dia-um-' + slug + '.png';
      a.href = c.toDataURL('image/png');
      a.click();
    };
    img.src = svg64;
  });
</script>
</body>
</html>
